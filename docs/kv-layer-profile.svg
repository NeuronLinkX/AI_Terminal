 fill="#5b6475">marginal-gain (optimal)</tspan></text><rect x="456" y="403" width="103.2" height="14" rx="3" fill="#c8323f"/><text x="565.2418999924122" y="414" fill="#1f2430">5.4% <tspan fill="#5b6475">marginal + Ada-KV heads</tspan></text></svg>
