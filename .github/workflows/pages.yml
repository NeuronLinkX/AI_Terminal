name: Pages
# Publishes the download site (site/) with GitHub Pages. One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# The site only links to the DMG / ZIP of the GitHub Release (see scripts/build-site.js); the installers themselves are not part of it.
on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
